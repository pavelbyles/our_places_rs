services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    command: ["postgres", "-c", "shared_preload_libraries=pg_cron", "-c", "cron.database_name=our_places"]
    container_name: ourplaces_db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=our_places
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  booking_api:
    build:
      context: .
      dockerfile: Dockerfile.booking_api
      args:
        BUILD_TYPE: debug
        BUILD_OUTPUT: debug
        RELEASE_FLAG: ${BOOKING_API_RELEASE_FLAG:-}
    ports:
      - "8081:8080"
    environment:
      - RUST_LOG=info,booking_api=debug,db_core=debug
      - EA__DATABASE__HOST=db
      - EA__DATABASE__PORT=5432
      - EA__DATABASE__USERNAME=postgres
      - EA__DATABASE__PASSWORD=password
      - EA__DATABASE__DATABASE_NAME=our_places
      - EA__DATABASE__CLOUD=false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://0.0.0.0:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  listing_api:
    build:
      context: .
      dockerfile: Dockerfile.listing_api
      args:
        BUILD_TYPE: debug
        BUILD_OUTPUT: debug
        RELEASE_FLAG: ${LISTING_API_RELEASE_FLAG:-}
    ports:
      - "8082:8080"
    environment:
      - RUST_LOG=info,listing_api=debug,db_core=debug
      - EA__DATABASE__HOST=db
      - EA__DATABASE__PORT=5432
      - EA__DATABASE__USERNAME=postgres
      - EA__DATABASE__PASSWORD=password
      - EA__DATABASE__DATABASE_NAME=our_places
      - EA__DATABASE__CLOUD=false
      - GCS_RAW_BUCKET=our-places-gcs-img-raw
      - GOOGLE_APPLICATION_CREDENTIALS=/home/pav/Downloads/our-places-dev-sa-listing-api.json
    volumes:
      - /home/pav/Downloads/our-places-dev-sa-listing-api.json:/home/pav/Downloads/our-places-dev-sa-listing-api.json:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://0.0.0.0:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  user_api:
    build:
      context: .
      dockerfile: Dockerfile.user_api
      args:
        BUILD_TYPE: debug
        BUILD_OUTPUT: debug
        RELEASE_FLAG: ${USER_API_RELEASE_FLAG:-}
    ports:
      - "8083:8080"
    environment:
      - RUST_LOG=info,user_api=debug,db_core=debug
      - EA__DATABASE__HOST=db
      - EA__DATABASE__PORT=5432
      - EA__DATABASE__USERNAME=postgres
      - EA__DATABASE__PASSWORD=password
      - EA__DATABASE__DATABASE_NAME=our_places
      - EA__DATABASE__CLOUD=false
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://0.0.0.0:8080/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  image-worker:
    build:
      context: .
      dockerfile: Dockerfile.image_worker
      args:
        BUILD_TYPE: debug
        BUILD_OUTPUT: debug
        RELEASE_FLAG: ""
    ports:
      - "8084:8080"
    environment:
      - RUST_LOG=info,db_core=debug,listing_api=debug
      - EA__DATABASE__HOST=db
      - EA__DATABASE__PORT=5432
      - EA__DATABASE__USERNAME=postgres
      - EA__DATABASE__PASSWORD=password
      - EA__DATABASE__DATABASE_NAME=our_places
      - EA__DATABASE__CLOUD=false
      - GCS_RAW_BUCKET=our-places-gcs-img-raw
    depends_on:
      db:
        condition: service_healthy
      listing_api:
        condition: service_healthy

  web_ui_guest:
    build:
      context: .
      dockerfile: Dockerfile.web_ui_guest
      args:
        RELEASE_FLAG: ${WEB_UI_GUEST_RELEASE_FLAG:-}
    ports:
      - "3010:8080"
    environment:
      - RUST_LOG=info,web_ui_guest=debug
      - HOST=0.0.0.0
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-secret}
      - LISTING_API_URL=http://listing_api:8080
      - USER_API_URL=http://user_api:8080
      - BOOKING_API_URL=http://booking_api:8080
    depends_on:
      listing_api:
        condition: service_healthy
      user_api:
        condition: service_healthy
      booking_api:
        condition: service_healthy

  web_ui_admin:
    build:
      context: .
      dockerfile: Dockerfile.web_ui_admin
      args:
        RELEASE_FLAG: ${WEB_UI_ADMIN_RELEASE_FLAG:-}
    ports:
      - "3012:8080"
    environment:
      - RUST_LOG=info,web_ui_admin=debug
      - HOST=0.0.0.0
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:-secret}
      - LISTING_API_URL=http://listing_api:8080
      - USER_API_URL=http://user_api:8080
      - BOOKING_API_URL=http://booking_api:8080
    depends_on:
      listing_api:
        condition: service_healthy
      user_api:
        condition: service_healthy
      booking_api:
        condition: service_healthy

volumes:
  postgres_data_dev:
