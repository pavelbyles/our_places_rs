openapi: 3.0.0
info:
  title: Our Places API
  description: API Gateway for Our Places services (User, Listing, Booking).
  version: 1.0.0

# ------------------------------------------------------------------------------
# 1. CENTRAL BACKEND DEFINITIONS (REQUIRED FOR v3)
# ------------------------------------------------------------------------------
x-google-api-management:
  backends:
    user-backend:
      address: https://user-api-main-689343985534.us-central1.run.app
      pathTranslation: APPEND_PATH_TO_ADDRESS
      protocol: h2
    listing-backend:
      address: https://listing-api-main-689343985534.us-central1.run.app
      pathTranslation: APPEND_PATH_TO_ADDRESS
      protocol: h2
    booking-backend:
      address: https://booking-api-main-689343985534.us-central1.run.app
      pathTranslation: APPEND_PATH_TO_ADDRESS
      protocol: h2

# Global Security
security:
  - api_key: []

paths:
  # ----------------------------------------------------------------------------
  # USER API
  # ----------------------------------------------------------------------------
  /api/v1/users:
    get:
      summary: Get all users
      operationId: getAllUsers
      tags:
        - users
      x-google-backend: user-backend
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
        - in: query
          name: search
          schema:
            type: string
          description: Search by name or email
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserResponse"
        "500":
          description: Internal server error
    post:
      summary: Create a new user
      operationId: createUser
      tags:
        - users
      x-google-backend: user-backend
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUserRequest"
      responses:
        "201":
          description: User Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error
        "500":
          description: Internal server error

  /api/v1/users/login:
    post:
      summary: User login
      operationId: login
      tags:
        - users
        - auth
      x-google-backend: user-backend
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Invalid credentials
        "500":
          description: Internal server error

  /api/v1/users/verify:
    post:
      summary: Verify user
      operationId: verifyUser
      tags:
        - users
        - auth
      x-google-backend: user-backend
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Verification successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Invalid code or expired
        "500":
          description: Internal server error

  /api/v1/users/resend-verification:
    post:
      summary: Resend verification code
      operationId: resendVerification
      tags:
        - users
        - auth
      x-google-backend: user-backend
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Resend verification successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: User not found or already verified
        "500":
          description: Internal server error

  /api/v1/users/user/{email}:
    get:
      summary: Get user by email
      operationId: getUserByEmail
      tags:
        - users
      x-google-backend: user-backend
      parameters:
        - in: path
          name: email
          schema:
            type: string
          required: true
          description: User email
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "404":
          description: User not found
        "500":
          description: Internal server error

  /api/v1/users/id/{id}:
    patch:
      summary: Update user
      operationId: updateUser
      tags:
        - users
      x-google-backend: user-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
          description: User UUID
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatedUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Validation error
        "500":
          description: Internal server error

  /api/v1/users/user/{email}/bookings:
    get:
      summary: Get user bookings
      operationId: getUserBookings
      tags:
        - users
        - bookings
      x-google-backend: user-backend
      parameters:
        - in: path
          name: email
          schema:
            type: string
          required: true
          description: User email
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of bookings for user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingResponse"
        "500":
          description: Internal server error

  /api/v1/users/user/{email}/listings:
    get:
      summary: Get user listings
      operationId: getUserListings
      tags:
        - users
        - listings
      x-google-backend: user-backend
      parameters:
        - in: path
          name: email
          schema:
            type: string
          required: true
          description: User email
      responses:
        "200":
          description: List of listings for user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListingResponse"
        "500":
          description: Internal server error

  /api/v1/sessions:
    post:
      summary: Create or register a session
      operationId: createSession
      tags:
        - sessions
      x-google-backend: user-backend
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "400":
          description: Validation error
        "500":
          description: Internal server error

  /api/v1/sessions/{token_hash}:
    get:
      summary: Get and touch session by token hash
      operationId: getSession
      tags:
        - sessions
      x-google-backend: user-backend
      parameters:
        - in: path
          name: token_hash
          required: true
          schema:
            type: string
        - in: query
          name: namespace
          schema:
            type: string
      responses:
        "200":
          description: Session details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "404":
          description: Session not found or expired
        "500":
          description: Internal server error
    delete:
      summary: Delete a session
      operationId: deleteSession
      tags:
        - sessions
      x-google-backend: user-backend
      parameters:
        - in: path
          name: token_hash
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session deleted
        "500":
          description: Internal server error

  /api/v1/users/{user_id}/sessions:
    delete:
      summary: Revoke all active sessions for a user
      operationId: revokeUserSessions
      tags:
        - users
        - sessions
      x-google-backend: user-backend
      parameters:
        - in: path
          name: user_id
          required: true
          schema:
            type: string
            format: uuid
        - in: query
          name: namespace
          schema:
            type: string
      responses:
        "204":
          description: User sessions revoked
        "500":
          description: Internal server error



  # ----------------------------------------------------------------------------
  # LISTING API
  # ----------------------------------------------------------------------------
  /api/v1/listings:
    get:
      summary: Get listings
      operationId: getListings
      tags:
        - listings
      x-google-backend: listing-backend
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
        - in: query
          name: name
          schema:
            type: string
        - in: query
          name: country
          schema:
            type: string
        - in: query
          name: min_price
          schema:
            type: number
        - in: query
          name: max_price
          schema:
            type: number
        - in: query
          name: structure_type
          schema:
            type: string
            enum: [Apartment, House, Townhouse, Studio, Villa]
      responses:
        "200":
          description: List of listings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ListingResponse"
        "500":
          description: Internal server error
    post:
      summary: Create a new listing
      operationId: createListing
      tags:
        - listings
      x-google-backend: listing-backend
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewListingRequest"
      responses:
        "201":
          description: Listing created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "400":
          description: Validation error
        "500":
          description: Internal server error

  /api/v1/listings/listing/{id}:
    get:
      summary: Get listing by ID
      operationId: getListingById
      tags:
        - listings
      x-google-backend: listing-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Listing found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "404":
          description: Listing not found
        "500":
          description: Internal server error
    patch:
      summary: Update listing
      operationId: updateListing
      tags:
        - listings
      x-google-backend: listing-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatedListingRequest"
      responses:
        "200":
          description: Listing updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListingResponse"
        "400":
          description: Validation error
        "500":
          description: Internal server error
    delete:
      summary: Delete listing
      operationId: deleteListing
      tags:
        - listings
      x-google-backend: listing-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
        - in: query
          name: hard_delete
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Listing deleted
        "404":
          description: Listing not found
        "500":
          description: Internal server error

  # ----------------------------------------------------------------------------
  # BOOKING API
  # ----------------------------------------------------------------------------
  /api/v1/bookings:
    get:
      summary: Get bookings
      operationId: getBookings
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingResponse"
        "500":
          description: Internal server error
    post:
      summary: Create a new booking
      operationId: createBooking
      tags:
        - bookings
      x-google-backend: booking-backend
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: Validation error
        "500":
          description: Internal server error

  /api/v1/bookings/availability:
    get:
      summary: Check listing availability for dates
      operationId: checkAvailability
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: query
          name: listing_id
          schema:
            type: string
            format: uuid
          required: true
        - in: query
          name: date_from
          schema:
            type: string
            format: date
          required: true
        - in: query
          name: date_to
          schema:
            type: string
            format: date
          required: true
      responses:
        "200":
          description: Availability check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilityResponse"
        "500":
          description: Internal server error

  /api/v1/bookings/user/{id}:
    get:
      summary: Get all bookings for a user
      operationId: getUserBookings
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: List of bookings for user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingResponse"
        "500":
          description: Internal server error

  /api/v1/bookings/listing/{id}:
    get:
      summary: Get all bookings for a listing
      operationId: getListingBookings
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: List of bookings for listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingResponse"
        "500":
          description: Internal server error

  /api/v1/bookings/listing/{id}/unavailable-ranges:
    get:
      summary: Booked date ranges for a listing (public, dates only)
      operationId: getUnavailableRanges
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
        - in: query
          name: from
          schema:
            type: string
            format: date
          required: true
        - in: query
          name: to
          schema:
            type: string
            format: date
          required: true
      responses:
        "200":
          description: Merged, sorted booked ranges in the window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnavailableRangesResponse"
        "400":
          description: Window is empty, reversed, or longer than 366 days
        "404":
          description: Listing not found
        "500":
          description: Internal server error

  /api/v1/bookings/{id}:
    get:
      summary: Get booking by ID
      operationId: getBookingById
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Booking found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "404":
          description: Booking not found
        "500":
          description: Internal server error
    patch:
      summary: Update booking
      operationId: updateBooking
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatedBookingRequest"
      responses:
        "200":
          description: Booking updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "404":
          description: Booking not found
        "500":
          description: Internal server error
    delete:
      summary: Delete booking
      operationId: deleteBooking
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "204":
          description: Booking deleted
        "404":
          description: Booking not found
        "500":
          description: Internal server error

  /api/v1/bookings/{id}/transfer:
    post:
      summary: Transfer booking to a registered user
      operationId: transferBooking
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferBookingRequest"
      responses:
        "200":
          description: Booking guest transferred
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "400":
          description: Validation error
        "404":
          description: Booking not found or not pending
        "500":
          description: Internal server error

  /api/v1/bookings/{id}/documents:
    get:
      summary: List all statutory tax documents for a booking
      operationId: getBookingDocuments
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: List of statutory tax documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaxDocumentResponse"
        "404":
          description: Booking not found
        "500":
          description: Internal server error

  /api/v1/bookings/{id}/documents/{document_number}:
    get:
      summary: Get statutory tax document by document number
      operationId: getBookingDocumentByNumber
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
        - in: path
          name: document_number
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Statutory tax document found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxDocumentResponse"
        "404":
          description: Document not found
        "500":
          description: Internal server error

  /api/v1/bookings/{id}/cancellation-quote:
    get:
      summary: Get itemized cancellation refund quote
      operationId: getCancellationQuote
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Itemized cancellation refund quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundQuote"
        "404":
          description: Booking not found
        "500":
          description: Internal server error

  /api/v1/bookings/{id}/messages:
    get:
      summary: Get all messages for a booking
      operationId: getBookingMessages
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Messages retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingMessagesWrapper"
        "403":
          description: Forbidden
        "404":
          description: Booking not found
        "500":
          description: Internal server error
    post:
      summary: Send a message for a booking
      operationId: sendBookingMessage
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingMessageRequest"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingMessageResponse"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "500":
          description: Internal server error

  /api/v1/bookings/{id}/messages/read:
    patch:
      summary: Mark booking messages as read
      operationId: markBookingMessagesRead
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: path
          name: id
          schema:
            type: string
            format: uuid
          required: true
      responses:
        "200":
          description: Messages marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarkMessagesReadResponse"
        "403":
          description: Forbidden
        "404":
          description: Booking not found
        "500":
          description: Internal server error

  /api/v1/internal/cron/complete-stays:
    patch:
      summary: Daily cron sweep to complete past checkout stays and issue statutory tax invoices
      operationId: completeStaysCron
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: header
          name: x-cron-secret
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Past checkout stays completed and invoiced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompleteStaysResponse"
        "401":
          description: Unauthorized - invalid or missing cron secret
        "500":
          description: Internal server error

  /api/v1/internal/cron/process-scheduled-notifications:
    post:
      summary: Process scheduled booking notifications (pre-arrival guides and hold reminders)
      operationId: processScheduledNotifications
      tags:
        - bookings
      x-google-backend: booking-backend
      parameters:
        - in: header
          name: x-cron-secret
          schema:
            type: string
          required: true
      responses:
        "200":
          description: Scheduled notification sweep completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CronSweepResponse"
        "401":
          description: Unauthorized - invalid or missing cron secret
        "500":
          description: Internal server error

components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header

  schemas:
    # -------------------------------------------------------------
    # User Models
    # -------------------------------------------------------------
    NewUserRequest:
      type: object
      required:
        - email
        - password_hash
        - first_name
        - last_name
        - is_active
      properties:
        email:
          type: string
        password_hash:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        is_active:
          type: boolean

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string

    VerifyRequest:
      type: object
      required:
        - email
        - code
      properties:
        email:
          type: string
        code:
          type: string

    ResendVerificationRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string

    UpdatedUserRequest:
      type: object
      properties:
        email:
          type: string
        password_hash:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        is_active:
          type: boolean

    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        is_active:
          type: boolean
