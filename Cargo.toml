[workspace]
members = [
    "app_api/api_core",
    "app_api/booking_api",
    "app_api/listing_api",
    "app_api/user_api",
    "app_api/image_worker",
    "app_api/email_worker",
    "app_api/calendar_sync_job",
    "common",
    "db_core",
    "protoproj",
    "web_client",
    "web_ui_common",
    "web_ui_guest",
    "web_ui_admin",
]
resolver = "2"

[workspace.dependencies]
actix-web = "4.13.0"
api_core = { path = "app_api/api_core" }
common = { path = "common" }
db_core = { path = "db_core" }
topcoat = { version = "0.11.0", features = ["htmx", "tailwind", "session"] }

web_client = { path = "web_client" }
web_ui_common = { path = "web_ui_common" }
anyhow = "1.0.102"
dotenvy = "0.15.7"
rust_decimal_macros = "1.40.0"
serde-xml-rs = "0.8.2"
serde_json = "1.0.151"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-actix-web = "0.7.25"
tracing-log = "0.2.0"
tracing-subscriber = "0.3.23"
tracing-opentelemetry = { version = "0.34.0", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["http-proto", "trace"] }
opentelemetry-http = { version = "0.33.1", default-features = false }
reqwest = { version = "0.13.5", features = ["json"] }
metrics = "0.24.1"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rand = "0.10.3"
google-cloud-storage = "1.20.0"
topcoat-asset = { version = "0.11.0", features = ["bundler"] }
async-trait = "0.1.89"
bcrypt = "0.19.0"
base64 = "0.23.1"
subtle = "2.6.1"
sha2 = "0.11.1"
url = "2.5"

[workspace.dependencies.chrono]
version = "0.4.44"
features = ["serde"]

[workspace.dependencies.config]
version = "0.15.27"
features = ["toml"]

[workspace.dependencies.rust_decimal]
version = "1.42.0"
features = ["serde", "serde-with-float", "serde-with-str"]

[workspace.dependencies.serde]
version = "1.0.228"
features = ["derive"]

[workspace.dependencies.sqlx]
version = "0.8.6"
features = [
    "runtime-tokio-rustls",
    "macros",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "rust_decimal",
    "json",
]
default-features = false

[workspace.dependencies.tokio]
version = "1.53.2"

[workspace.dependencies.utoipa]
version = "6.0.0"
features = ["actix_extras", "decimal", "chrono", "uuid"]

[workspace.dependencies.utoipa-swagger-ui]
version = "10.0.1"
features = ["actix-web"]

[workspace.dependencies.uuid]
version = "1.27.0"
features = ["v7", "serde"]

[workspace.dependencies.validator]
version = "0.21.0"
features = ["derive"]

# Tuned for request throughput and cold start on Cloud Run, not binary size:
# full optimisation, whole-program LTO, and no symbol tables to map at exec.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
debug = false
incremental = false
