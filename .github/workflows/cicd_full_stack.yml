name: Full Stack CI/CD

env:
  ENV_SUFFIX: ${{ github.ref == 'refs/heads/main' && 'PROD' || 'DEV' }}
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  GAR_REPO: ${{ vars.GAR_REPO}}
  REGION: us-central1
  SERVICE_PREFIX_WEB_UI_GUEST: our-places-web-ui-guest
  SERVICE_PREFIX_WEB_UI_ADMIN: our-places-web-ui-admin
  SERVICE_PREFIX_IMAGE_WORKER: our-places-image-worker
  SERVICE_PREFIX_EMAIL_WORKER: our-places-email-worker
  CARGO_TERM_COLOR: always
  GCS_PUBLIC_BUCKET_PREFIX: ${{ vars.INFRA_GCS_BUCKET_PUBLIC_PREFIX }}
  GCS_RAW_BUCKET_PREFIX: ${{ vars.INFRA_GCS_BUCKET_RAW_PREFIX }}

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Select services to build & deploy'
        required: true
        default: 'changed'
        type: choice
        options:
          - 'changed'
          - 'all'
          - 'backend'
          - 'image_worker'
          - 'email_worker'
          - 'web_ui_guest'
          - 'web_ui_admin'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # CHANGE DETECTION FOR SELECTIVE CI/CD
  # =========================================================
  changes:
    name: Detect Changes
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.eval.outputs.backend }}
      image_worker: ${{ steps.eval.outputs.image_worker }}
      email_worker: ${{ steps.eval.outputs.email_worker }}
      web_ui_guest: ${{ steps.eval.outputs.web_ui_guest }}
      web_ui_admin: ${{ steps.eval.outputs.web_ui_admin }}
      docs_only: ${{ steps.eval.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs_only:
              - '!**/*.rs'
              - '!**/*.toml'
              - '!**/*.lock'
              - '!**/*.json'
              - '!**/*.css'
              - '!**/*.html'
              - '!**/*Dockerfile*'
              - '!**/*.sql'
              - '!**/*.ya?ml'
            backend:
              - 'app_api/**'
              - 'common/**'
              - 'db_core/**'
              - 'Cargo.*'
              - 'Dockerfile.*'
              - '.github/workflows/cicd_full_stack.yml'
            image_worker:
              - 'app_api/image_worker/**'
              - 'common/**'
              - 'db_core/**'
              - 'Cargo.*'
              - 'Dockerfile.image_worker'
              - '.github/workflows/cicd_full_stack.yml'
            email_worker:
              - 'app_api/email_worker/**'
              - 'common/**'
              - 'db_core/**'
              - 'Cargo.*'
              - 'Dockerfile.email_worker'
              - '.github/workflows/cicd_full_stack.yml'
            web_ui_guest:
              - 'web_ui_guest/**'
              - 'web_ui_common/**'
              - 'web_client/**'
              - 'common/**'
              - 'Cargo.*'
              - 'Dockerfile.web_ui_guest'
              - '.github/workflows/cicd_full_stack.yml'
            web_ui_admin:
              - 'web_ui_admin/**'
              - 'web_ui_common/**'
              - 'web_client/**'
              - 'common/**'
              - 'Cargo.*'
              - 'Dockerfile.web_ui_admin'
              - '.github/workflows/cicd_full_stack.yml'

      - name: Evaluate Change Flags
        id: eval
        run: |
          TARGET="${{ inputs.deploy_target || 'changed' }}"
          echo "deploy_target=$TARGET"

          if [ "$TARGET" = "all" ]; then
            echo "backend=true" >> $GITHUB_OUTPUT
            echo "image_worker=true" >> $GITHUB_OUTPUT
            echo "email_worker=true" >> $GITHUB_OUTPUT
            echo "web_ui_guest=true" >> $GITHUB_OUTPUT
            echo "web_ui_admin=true" >> $GITHUB_OUTPUT
            echo "docs_only=false" >> $GITHUB_OUTPUT
          elif [ "$TARGET" != "changed" ]; then
            echo "backend=${{ inputs.deploy_target == 'backend' || steps.filter.outputs.backend == 'true' }}" >> $GITHUB_OUTPUT
            echo "image_worker=${{ inputs.deploy_target == 'image_worker' || steps.filter.outputs.image_worker == 'true' }}" >> $GITHUB_OUTPUT
            echo "email_worker=${{ inputs.deploy_target == 'email_worker' || steps.filter.outputs.email_worker == 'true' }}" >> $GITHUB_OUTPUT
            echo "web_ui_guest=${{ inputs.deploy_target == 'web_ui_guest' || steps.filter.outputs.web_ui_guest == 'true' }}" >> $GITHUB_OUTPUT
            echo "web_ui_admin=${{ inputs.deploy_target == 'web_ui_admin' || steps.filter.outputs.web_ui_admin == 'true' }}" >> $GITHUB_OUTPUT
            echo "docs_only=false" >> $GITHUB_OUTPUT
          else
            echo "backend=${{ steps.filter.outputs.backend }}" >> $GITHUB_OUTPUT
            echo "image_worker=${{ steps.filter.outputs.image_worker }}" >> $GITHUB_OUTPUT
            echo "email_worker=${{ steps.filter.outputs.email_worker }}" >> $GITHUB_OUTPUT
            echo "web_ui_guest=${{ steps.filter.outputs.web_ui_guest }}" >> $GITHUB_OUTPUT
            echo "web_ui_admin=${{ steps.filter.outputs.web_ui_admin }}" >> $GITHUB_OUTPUT
            echo "docs_only=${{ steps.filter.outputs.docs_only }}" >> $GITHUB_OUTPUT
          fi

  # =========================================================
  # GENERAL QUALITY CHECKS
  # =========================================================
  audit:
    name: Audit
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  lint-check:
    name: Lint Check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Run Clippy
        env:
          RUN_ENV: Development
          SQLX_OFFLINE: true
          DATABASE_URL: postgres://postgres:password@localhost:5432/our_places
        run: cargo clippy --workspace --exclude protoproj --all-features --manifest-path Cargo.toml -- -D warnings
  # =========================================================
  # Test API's and Web App
  # =========================================================
  test-api:
    name: Test API
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo make
        uses: davidB/rust-cargo-make@v1
      - name: Install sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli
      - name: Build app
        env:
          RUN_ENV: Development
          SQLX_OFFLINE: true
          DATABASE_URL: postgres://postgres:password@localhost:5432/our_places
        run: cargo build --verbose --workspace --exclude web_client --exclude web_ui_common --exclude web_ui_guest --exclude web_ui_admin --exclude protoproj
      - name: Run DB and Migrations (Local Test)
        run: cargo make --cwd app_api/listing_api db-migrate
      - name: Run testsTest API
        env:
          RUN_ENV: Development
          SQLX_OFFLINE: true
          DATABASE_URL: postgres://postgres:password@localhost:5432/our_places
        run: cargo test --verbose --workspace --exclude web_client --exclude web_ui_common --exclude web_ui_guest --exclude web_ui_admin --exclude protoproj

  test-web-ui:
    name: Test Web UI
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
      - name: Run web_client and web_ui_* tests
        env:
          SQLX_OFFLINE: true
        run: cargo test -p web_client -p web_ui_common -p web_ui_guest -p web_ui_admin --verbose

  # =========================================================
  # SETUP GCS BUCKETS
  # =========================================================
  setup-gcs-image-gcs-items:
    name: Setup GCS Buckets
    runs-on: ubuntu-latest
    needs: [audit, lint-check, test-api, changes]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || needs.changes.outputs.image_worker == 'true' || needs.changes.outputs.backend == 'true')
    env:
      SA_IMAGE_WORKER: ${{ vars[format('INFRA_SA_IMAGE_WORKER_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      SA_LISTING_API: ${{ vars[format('INFRA_SA_LISTING_API_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Sanitize Branch Name
        id: branch_name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SAFE_BRANCH_slug=$(echo "$REF_NAME" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g' | cut -c 1-35 | sed 's/-$//')
          SAFE_SCHEMA_name=$(echo "$REF_NAME" | tr '/' '_' | tr '-' '_' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_]//g')
          if [[ "$REF_NAME" == "main" ]]; then
            SAFE_SCHEMA_name="public"
          elif [[ $SAFE_SCHEMA_name =~ ^[0-9] ]]; then
            SAFE_SCHEMA_name="_$SAFE_SCHEMA_name"
          fi
          echo "SERVICE_SUFFIX=$SAFE_BRANCH_slug" >> $GITHUB_OUTPUT
          echo "SCHEMA_NAME=$SAFE_SCHEMA_name" >> $GITHUB_OUTPUT
          PROJECT_NUMBER=$(gcloud projects describe ${{ env.PROJECT_ID }} --format="value(projectNumber)")

      - name: Create GCS Buckets
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}

          echo "Creating raw image bucket..."
          RAW_BUCKET="gs://${{ env.GCS_RAW_BUCKET_PREFIX }}-$SUFFIX"
          echo "Checking if raw bucket $RAW_BUCKET exists..."
          if ! gcloud storage buckets describe $RAW_BUCKET >/dev/null 2>&1; then
            echo "Creating raw image bucket..."
            gcloud storage buckets create $RAW_BUCKET \
              --location=us-central1 \
              --default-storage-class=STANDARD \
              --uniform-bucket-level-access \
              --soft-delete-duration=0
          else
            echo "Raw bucket already exists."
          fi
            
          PUBLIC_BUCKET="gs://${{ env.GCS_PUBLIC_BUCKET_PREFIX }}-$SUFFIX"
          echo "Checking if public bucket $PUBLIC_BUCKET exists..."
          if ! gcloud storage buckets describe $PUBLIC_BUCKET >/dev/null 2>&1; then
            echo "Creating public image bucket..."
            gcloud storage buckets create $PUBLIC_BUCKET \
              --location=us-central1 \
              --default-storage-class=STANDARD \
              --uniform-bucket-level-access \
              --soft-delete-duration=0
          else
            echo "Public bucket already exists."
          fi

          echo "Making public image bucket accessible to allUsers..."
          gcloud storage buckets update gs://${{ env.GCS_PUBLIC_BUCKET_PREFIX }}-$SUFFIX \
            --no-public-access-prevention || true

          gcloud storage buckets add-iam-policy-binding gs://${{ env.GCS_PUBLIC_BUCKET_PREFIX }}-$SUFFIX \
            --member="allUsers" \
            --role="roles/storage.objectViewer" || true

      - name: Grant GCS Bucket Permissions to SA
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          SA_EMAIL="${{ env.SA_IMAGE_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

          echo "Granting storage.objectAdmin role to $SA_EMAIL on raw bucket..."
          gcloud storage buckets add-iam-policy-binding gs://${{ env.GCS_RAW_BUCKET_PREFIX }}-$SUFFIX \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/storage.objectAdmin"

          echo "Granting storage.objectAdmin role to $SA_EMAIL on public bucket..."
          gcloud storage buckets add-iam-policy-binding gs://${{ env.GCS_PUBLIC_BUCKET_PREFIX }}-$SUFFIX \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/storage.objectAdmin"
      # listing_api signs the upload URLs (IAM signBlob as itself), and the
      # browser's PUT is authorized as that service account.
      - name: Grant Signed Upload Permissions to Listing API SA
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          SA_EMAIL="${{ env.SA_LISTING_API }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

          echo "Granting storage.objectCreator to $SA_EMAIL on raw bucket..."
          gcloud storage buckets add-iam-policy-binding gs://${{ env.GCS_RAW_BUCKET_PREFIX }}-$SUFFIX \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/storage.objectCreator"

          echo "Granting iam.serviceAccountTokenCreator to $SA_EMAIL on itself..."
          gcloud iam service-accounts add-iam-policy-binding $SA_EMAIL \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/iam.serviceAccountTokenCreator" \
            --quiet

      - name: Create PubSub Topic
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          TOPIC_NAME="our-places-image-uploads-raw-$SUFFIX"
          echo "Checking if topic $TOPIC_NAME exists..."
          if ! gcloud pubsub topics describe $TOPIC_NAME >/dev/null 2>&1; then
            echo "Creating PubSub topic $TOPIC_NAME..."
            gcloud pubsub topics create $TOPIC_NAME
          else
            echo "Topic already exists."
          fi

      - name: Grant Pub/Sub Subscription Permission to SA
        run: |
          PROJECT_NUMBER=$(gcloud projects describe ${{ env.PROJECT_ID }} --format="value(projectNumber)")
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          TOPIC_NAME="our-places-image-uploads-raw-$SUFFIX"
          SA_EMAIL="${{ env.SA_IMAGE_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

          echo "Granting pubsub.subscriber role to $SA_EMAIL on topic $TOPIC_NAME..."
          gcloud pubsub topics add-iam-policy-binding $TOPIC_NAME \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/pubsub.subscriber" \
            --project=${{ env.PROJECT_ID }}

      - name: Create Notification Config
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          BUCKET_NAME="gs://${{ env.GCS_RAW_BUCKET_PREFIX }}-$SUFFIX"
          TOPIC_NAME="our-places-image-uploads-raw-$SUFFIX"

          echo "Cleaning up existing notifications for $BUCKET_NAME..."
          # List all notification IDs and delete them one by one
          for id in $(gcloud storage buckets notifications list $BUCKET_NAME --format="value(\"Notification Configuration\".id)"); do
            echo "Deleting notification $id..."
            gcloud storage buckets notifications delete projects/_/buckets/${BUCKET_NAME#gs://}/notificationConfigs/$id --quiet || true
          done

          echo "Creating fresh notification config for $TOPIC_NAME..."
          gcloud storage buckets notifications create $BUCKET_NAME \
            --topic=$TOPIC_NAME \
            --event-types=OBJECT_FINALIZE

  # =========================================================
  # DEPLOY IMAGE WORKER
  # =========================================================
  deploy-image-worker:
    name: Build & Deploy Image Worker
    runs-on: ubuntu-latest
    needs: [setup-gcs-image-gcs-items, changes]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || needs.changes.outputs.image_worker == 'true')
    env:
      SA_IMAGE_WORKER: ${{ vars[format('INFRA_SA_IMAGE_WORKER_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      GCS_BUCKET_RAW_PREFIX: ${{ vars.INFRA_GCS_BUCKET_RAW_PREFIX }}
      DB_USER: ${{ vars[format('DB_USER_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_PASS: ${{ secrets[format('DB_PASSWORD_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_NAME: ${{ vars[format('DB_NAME_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_INSTANCE_NAME: ${{ vars[format('DB_INSTANCE_NAME_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        env:
          REGION: ${{ env.REGION }}
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sanitize Branch Name
        id: branch_name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SAFE_BRANCH_slug=$(echo "$REF_NAME" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g' | cut -c 1-35 | sed 's/-$//')
          SAFE_SCHEMA_name=$(echo "$REF_NAME" | tr '/' '_' | tr '-' '_' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_]//g')
          if [[ "$REF_NAME" == "main" ]]; then
            SAFE_SCHEMA_name="public"
          elif [[ $SAFE_SCHEMA_name =~ ^[0-9] ]]; then
            SAFE_SCHEMA_name="_$SAFE_SCHEMA_name"
          fi
          echo "SERVICE_SUFFIX=$SAFE_BRANCH_slug" >> $GITHUB_OUTPUT
          echo "SCHEMA_NAME=$SAFE_SCHEMA_name" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=image-worker \
            --cache-to type=gha,mode=max,scope=image-worker \
            -f Dockerfile.image_worker \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_PREFIX_IMAGE_WORKER }}:${{ steps.branch_name.outputs.SERVICE_SUFFIX }} \
            --push .

      - name: Deploy to Cloud Run
        id: deploy_image_worker
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_PREFIX_IMAGE_WORKER }}-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_PREFIX_IMAGE_WORKER }}:${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          region: ${{ env.REGION }}
          env_vars: |
            LOG_FORMAT=json
            RUST_LOG=info
            EA__SERVER__HOST=0.0.0.0
            EA__SERVER__PORT=8080
            EA__DATABASE__CLOUD=true
            EA__DATABASE__INSTANCE_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }}
            EA__DATABASE__USERNAME=${{ env.DB_USER }}
            EA__DATABASE__PASSWORD=${{ env.DB_PASS }}
            EA__DATABASE__DATABASE_NAME=${{ env.DB_NAME}}
            EA__DATABASE__DATABASE_URL=postgres://${{ env.DB_USER }}:${{ env.DB_PASS }}@localhost/${{ env.DB_NAME}}?host=/cloudsql/${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }}&options=-c%20search_path%3D${{ steps.branch_name.outputs.SCHEMA_NAME }}
            GCS_RAW_BUCKET=${{ env.GCS_BUCKET_RAW_PREFIX }}-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
            GCS_PUBLIC_BUCKET=${{ env.GCS_PUBLIC_BUCKET_PREFIX }}-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          flags: "--no-allow-unauthenticated --service-account ${{ env.SA_IMAGE_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --ingress=internal --min-instances=0 --max-instances=1 --memory=1Gi --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }} --quiet"

      - name: Grant Pub/Sub Service Account Invoker Permission
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          SA_EMAIL="${{ env.SA_IMAGE_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

          echo "Granting run.invoker to $SA_EMAIL for image-worker service..."
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_PREFIX_IMAGE_WORKER }}-$SUFFIX \
            --region=${{ env.REGION }} \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/run.invoker" \
            --quiet

      - name: Configure the Subscription (Push to Image Worker)
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          WORKER_URL=$(gcloud run services describe ${{ env.SERVICE_PREFIX_IMAGE_WORKER }}-$SUFFIX --region ${{ env.REGION }} --format 'value(status.url)')

          echo "Configuring subscription for $WORKER_URL..."
          if gcloud pubsub subscriptions describe our-places-image-worker-sub-$SUFFIX >/dev/null 2>&1; then
            gcloud pubsub subscriptions update our-places-image-worker-sub-$SUFFIX \
              --push-endpoint=$WORKER_URL/api/v1/internal/image/process_image \
              --push-auth-service-account=${{ env.SA_IMAGE_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
              --ack-deadline=120
          else
            gcloud pubsub subscriptions create our-places-image-worker-sub-$SUFFIX \
              --topic=our-places-image-uploads-raw-$SUFFIX \
              --push-endpoint=$WORKER_URL/api/v1/internal/image/process_image \
              --push-auth-service-account=${{ env.SA_IMAGE_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
              --ack-deadline=120
          fi

  # =========================================================
  # DEPLOY EMAIL WORKER
  # =========================================================
  deploy-email-worker:
    name: Build & Deploy Email Worker
    runs-on: ubuntu-latest
    needs: [audit, lint-check, test-api, changes]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || needs.changes.outputs.email_worker == 'true')
    env:
      SA_EMAIL_WORKER: ${{ vars[format('INFRA_SA_EMAIL_WORKER_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] || vars[format('INFRA_SA_IMAGE_WORKER_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_USER: ${{ vars[format('DB_USER_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_PASS: ${{ secrets[format('DB_PASSWORD_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_NAME: ${{ vars[format('DB_NAME_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_INSTANCE_NAME: ${{ vars[format('DB_INSTANCE_NAME_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      SMTP_HOST: ${{ vars[format('SMTP_HOST_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      SMTP_USER: ${{ vars[format('SMTP_USER_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      SMTP_PASS: ${{ secrets[format('SMTP_PASS_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      SMTP_FROM: ${{ vars[format('SMTP_FROM_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        env:
          REGION: ${{ env.REGION }}
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sanitize Branch Name
        id: branch_name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SAFE_BRANCH_slug=$(echo "$REF_NAME" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g' | cut -c 1-35 | sed 's/-$//')
          SAFE_SCHEMA_name=$(echo "$REF_NAME" | tr '/' '_' | tr '-' '_' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_]//g')
          if [[ "$REF_NAME" == "main" ]]; then
            SAFE_SCHEMA_name="public"
          elif [[ $SAFE_SCHEMA_name =~ ^[0-9] ]]; then
            SAFE_SCHEMA_name="_$SAFE_SCHEMA_name"
          fi
          echo "SERVICE_SUFFIX=$SAFE_BRANCH_slug" >> $GITHUB_OUTPUT
          echo "SCHEMA_NAME=$SAFE_SCHEMA_name" >> $GITHUB_OUTPUT

      - name: Ensure PubSub Topic and Subscription Permissions
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          TOPIC_NAME="our-places-email-notifications-$SUFFIX"
          SA_EMAIL="${{ env.SA_EMAIL_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

          if ! gcloud pubsub topics describe $TOPIC_NAME >/dev/null 2>&1; then
            echo "Creating PubSub topic $TOPIC_NAME..."
            gcloud pubsub topics create $TOPIC_NAME
          else
            echo "PubSub topic $TOPIC_NAME already exists."
          fi

          echo "Granting pubsub.subscriber role to $SA_EMAIL on topic $TOPIC_NAME..."
          gcloud pubsub topics add-iam-policy-binding $TOPIC_NAME \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/pubsub.subscriber" \
            --project=${{ env.PROJECT_ID }} \
            --quiet || true

          PROJECT_NUMBER=$(gcloud projects describe ${{ env.PROJECT_ID }} --format="value(projectNumber)")
          PUBSUB_SERVICE_AGENT="service-${PROJECT_NUMBER}@gcp-sa-pubsub.iam.gserviceaccount.com"
          echo "Granting roles/iam.serviceAccountTokenCreator to $PUBSUB_SERVICE_AGENT on $SA_EMAIL..."
          gcloud iam service-accounts add-iam-policy-binding $SA_EMAIL \
            --member="serviceAccount:$PUBSUB_SERVICE_AGENT" \
            --role="roles/iam.serviceAccountTokenCreator" \
            --quiet || true

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --cache-from type=gha,scope=email-worker \
            --cache-to type=gha,mode=max,scope=email-worker \
            -f Dockerfile.email_worker \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_PREFIX_EMAIL_WORKER }}:${{ steps.branch_name.outputs.SERVICE_SUFFIX }} \
            --push .

      - name: Deploy to Cloud Run
        id: deploy_email_worker
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_PREFIX_EMAIL_WORKER }}-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_PREFIX_EMAIL_WORKER }}:${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          region: ${{ env.REGION }}
          env_vars: |
            LOG_FORMAT=json
            RUST_LOG=info
            EA__SERVER__HOST=0.0.0.0
            EA__SERVER__PORT=8080
            EA__DATABASE__CLOUD=true
            EA__DATABASE__INSTANCE_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }}
            EA__DATABASE__USERNAME=${{ env.DB_USER }}
            EA__DATABASE__PASSWORD=${{ env.DB_PASS }}
            EA__DATABASE__DATABASE_NAME=${{ env.DB_NAME}}
            EA__DATABASE__DATABASE_URL=postgres://${{ env.DB_USER }}:${{ env.DB_PASS }}@localhost/${{ env.DB_NAME}}?host=/cloudsql/${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }}&options=-c%20search_path%3D${{ steps.branch_name.outputs.SCHEMA_NAME }}
            SMTP_HOST=${{ env.SMTP_HOST }}
            SMTP_PORT=587
            SMTP_USERNAME=${{ env.SMTP_USER }}
            SMTP_PASSWORD=${{ env.SMTP_PASS }}
            SMTP_FROM_EMAIL=${{ env.SMTP_FROM }}
            SMTP_USER=${{ env.SMTP_USER }}
            SMTP_PASS=${{ env.SMTP_PASS }}
            SMTP_FROM=${{ env.SMTP_FROM }}
            USE_MOCK_EMAIL_PROVIDER=false
          flags: "--no-allow-unauthenticated --service-account ${{ env.SA_EMAIL_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --ingress=internal --min-instances=0 --max-instances=1 --memory=256Mi --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }} --quiet"

      - name: Grant Pub/Sub Service Account Invoker Permission
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          SA_EMAIL="${{ env.SA_EMAIL_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

          echo "Granting run.invoker to $SA_EMAIL for email-worker service..."
          gcloud run services add-iam-policy-binding ${{ env.SERVICE_PREFIX_EMAIL_WORKER }}-$SUFFIX \
            --region=${{ env.REGION }} \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/run.invoker" \
            --quiet

      - name: Configure the Subscription (Push to Email Worker)
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          WORKER_URL=$(gcloud run services describe ${{ env.SERVICE_PREFIX_EMAIL_WORKER }}-$SUFFIX --region ${{ env.REGION }} --format 'value(status.url)')

          echo "Configuring subscription for $WORKER_URL..."
          if gcloud pubsub subscriptions describe our-places-email-worker-sub-$SUFFIX >/dev/null 2>&1; then
            gcloud pubsub subscriptions update our-places-email-worker-sub-$SUFFIX \
              --push-endpoint=$WORKER_URL/pubsub/email-events \
              --push-auth-service-account=${{ env.SA_EMAIL_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
              --ack-deadline=60
          else
            gcloud pubsub subscriptions create our-places-email-worker-sub-$SUFFIX \
              --topic=our-places-email-notifications-$SUFFIX \
              --push-endpoint=$WORKER_URL/pubsub/email-events \
              --push-auth-service-account=${{ env.SA_EMAIL_WORKER }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
              --ack-deadline=60
          fi

  # =========================================================
  # DEPLOY API
  # =========================================================
  deploy-api:
    name: Build & Deploy APIs
    runs-on: ubuntu-latest
    needs: [audit, lint-check, test-api, changes]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.docs_only != 'true')
    defaults:
      run:
        working-directory: ./app_api
    env:
      SA_BOOKING_API: ${{ vars[format('INFRA_SA_BOOKING_API_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      SA_LISTING_API: ${{ vars[format('INFRA_SA_LISTING_API_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      SA_USER_API: ${{ vars[format('INFRA_SA_USER_API_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_USER: ${{ vars[format('DB_USER_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_PASS: ${{ secrets[format('DB_PASSWORD_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_NAME: ${{ vars[format('DB_NAME_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      DB_INSTANCE_NAME: ${{ vars[format('DB_INSTANCE_NAME_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      GCS_BUCKET_RAW_PREFIX: ${{ vars.INFRA_GCS_BUCKET_RAW_PREFIX }}
      TAJ_SUPPLIER_TRN: ${{ vars[format('TAJ_SUPPLIER_TRN_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] || vars.TAJ_SUPPLIER_TRN || '000-000-000' }}
      TAJ_SUPPLIER_NAME: ${{ vars[format('TAJ_SUPPLIER_NAME_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] || vars.TAJ_SUPPLIER_NAME || 'Our Places Jamaica Limited' }}
      TAJ_SUPPLIER_ADDRESS: ${{ vars[format('TAJ_SUPPLIER_ADDRESS_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] || vars.TAJ_SUPPLIER_ADDRESS || 'Main Street, Ocho Rios, St. Ann, Jamaica' }}
      CRON_SECRET: ${{ secrets[format('CRON_SECRET_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] || secrets.CRON_SECRET || 'dev-cron-secret' }}
      JWT_SECRET: ${{ secrets[format('JWT_SECRET_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
    permissions:
      contents: "read"
      id-token: "write"
      issues: "write"
      pull-requests: "write"
    outputs:
      service_suffix: ${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
      schema_name: ${{ steps.branch_name.outputs.SCHEMA_NAME }}
      listing_url: ${{ steps.construct_urls.outputs.listing_url }}
      booking_url: ${{ steps.construct_urls.outputs.booking_url }}
      user_url: ${{ steps.construct_urls.outputs.user_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        env:
          REGION: ${{ env.REGION }}
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sanitize Branch Name
        id: branch_name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          SAFE_BRANCH_slug=$(echo "$REF_NAME" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g' | cut -c 1-35 | sed 's/-$//')
          SAFE_SCHEMA_name=$(echo "$REF_NAME" | tr '/' '_' | tr '-' '_' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_]//g')
          if [[ "$REF_NAME" == "main" ]]; then
            SAFE_SCHEMA_name="public"
          elif [[ $SAFE_SCHEMA_name =~ ^[0-9] ]]; then
            SAFE_SCHEMA_name="_$SAFE_SCHEMA_name"
          fi
          echo "SERVICE_SUFFIX=$SAFE_BRANCH_slug" >> $GITHUB_OUTPUT
          echo "SCHEMA_NAME=$SAFE_SCHEMA_name" >> $GITHUB_OUTPUT

      - name: Require JWT Secret
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::Secret JWT_SECRET_${{ env.ENV_SUFFIX }} is not set. The APIs would fall back to a public default and the portals refuse to start without it."
            exit 1
          fi

      # deploy-cloudrun splits env_vars on commas, so commas inside values must be escaped.
      - name: Escape Env Values
        run: echo "TAJ_SUPPLIER_ADDRESS_ESCAPED=${TAJ_SUPPLIER_ADDRESS//,/\\,}" >> $GITHUB_ENV

      - name: Get Project Number & Construct URLs
        id: construct_urls
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
          SERVICE_SUFFIX: ${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          REGION: ${{ env.REGION }}
        run: |
          PROJECT_NUMBER=$(gcloud projects describe "$PROJECT_ID" --format="value(projectNumber)")

          echo "listing_url=https://listing-api-$SERVICE_SUFFIX-$PROJECT_NUMBER.$REGION.run.app" >> $GITHUB_OUTPUT
          echo "booking_url=https://booking-api-$SERVICE_SUFFIX-$PROJECT_NUMBER.$REGION.run.app" >> $GITHUB_OUTPUT
          echo "user_url=https://user-api-$SERVICE_SUFFIX-$PROJECT_NUMBER.$REGION.run.app" >> $GITHUB_OUTPUT

      - name: Set Build Arguments
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "RELEASE_FLAG=--release" >> $GITHUB_ENV
            echo "BUILD_OUTPUT=release" >> $GITHUB_ENV
          else
            echo "RELEASE_FLAG=" >> $GITHUB_ENV
            echo "BUILD_OUTPUT=debug" >> $GITHUB_ENV
          fi

      - name: Install SQLX CLI
        uses: taiki-e/install-action@v2
        with:
          tool: sqlx-cli

      - name: Setup Preview Schema
        env:
          DB_INSTANCE: ${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ vars[format('DB_INSTANCE_NAME_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
          SCHEMA_NAME: ${{ steps.branch_name.outputs.SCHEMA_NAME }}
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          wget https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.14.0/cloud-sql-proxy.linux.amd64 -O cloud-sql-proxy
          chmod +x cloud-sql-proxy
          ./cloud-sql-proxy --port 5432 $DB_INSTANCE &
          PID=$!
          sleep 5
          echo "Creating schema $SCHEMA_NAME if not exists..."
          export PGPASSWORD=$DB_PASS
          psql -h "127.0.0.1" -U "$DB_USER" -d "$DB_NAME" -c "CREATE SCHEMA IF NOT EXISTS \"$SCHEMA_NAME\";"

          # Run Migrations against the new schema
          echo "Running migrations..."
          # We need to set DATABASE_URL for sqlx. We point to the proxy on localhost.
          # We also need to set the search_path to the new schema so migrations apply there!
          export DATABASE_URL="postgres://$DB_USER:$DB_PASS@127.0.0.1:5432/$DB_NAME?options=-c%20search_path%3D$SCHEMA_NAME"
          # Run migrations using the sqlx cli we installed
          sqlx migrate run --source ../db_core/migrations

          kill $PID

      - name: Ensure Email Pub/Sub Topic and Publisher IAM
        run: |
          SUFFIX=${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          TOPIC_NAME="our-places-email-notifications-$SUFFIX"
          if ! gcloud pubsub topics describe $TOPIC_NAME >/dev/null 2>&1; then
            echo "Creating PubSub topic $TOPIC_NAME..."
            gcloud pubsub topics create $TOPIC_NAME
          else
            echo "PubSub topic $TOPIC_NAME already exists."
          fi
          for SA in "${{ env.SA_BOOKING_API }}" "${{ env.SA_USER_API }}"; do
            echo "Granting roles/pubsub.publisher to $SA on $TOPIC_NAME..."
            gcloud pubsub topics add-iam-policy-binding $TOPIC_NAME \
              --member="serviceAccount:$SA@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
              --role="roles/pubsub.publisher" \
              --project=${{ env.PROJECT_ID }} \
              --quiet || true
          done

      # Booking API
      - name: Build and Push Booking API
        run: |
          docker buildx build \
            --cache-from type=gha,scope=booking-api \
            --cache-to type=gha,mode=max,scope=booking-api \
            --build-arg RELEASE_FLAG=$RELEASE_FLAG \
            --build-arg BUILD_OUTPUT=$BUILD_OUTPUT \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/booking-api:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/booking-api:${{ steps.branch_name.outputs.SERVICE_SUFFIX }} \
            -f ../Dockerfile.booking_api \
            --push ..

      - name: Deploy Booking API
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: booking-api-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/booking-api:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: |
            LOG_FORMAT=json
            RUST_LOG=info
            EA__SERVER__HOST=0.0.0.0
            EA__SERVER__PORT=8080
            EA__DATABASE__CLOUD=true
            EA__DATABASE__INSTANCE_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }}
            EA__DATABASE__USERNAME=${{ env.DB_USER }}
            EA__DATABASE__PASSWORD=${{ env.DB_PASS }}
            EA__DATABASE__DATABASE_NAME=${{ env.DB_NAME}}
            EA__DATABASE__DATABASE_URL=postgres://${{ env.DB_USER }}:${{ env.DB_PASS }}@localhost/${{ env.DB_NAME}}?host=/cloudsql/${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }}&options=-c%20search_path%3D${{ steps.branch_name.outputs.SCHEMA_NAME }}
            EMAIL_PUBSUB_TOPIC_ID=our-places-email-notifications-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            TAJ_SUPPLIER_TRN=${{ env.TAJ_SUPPLIER_TRN }}
            TAJ_SUPPLIER_NAME=${{ env.TAJ_SUPPLIER_NAME }}
            TAJ_SUPPLIER_ADDRESS=${{ env.TAJ_SUPPLIER_ADDRESS_ESCAPED }}
            CRON_SECRET=${{ env.CRON_SECRET }}
            JWT_SECRET=${{ env.JWT_SECRET }}
          flags: "--no-allow-unauthenticated --service-account ${{ env.SA_BOOKING_API }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --ingress=all --min-instances=0 --max-instances=1 --memory=256Mi --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }} --quiet"

      # Listing API
      - name: Build and Push Listing API
        run: |
          docker buildx build \
            --cache-from type=gha,scope=listing-api \
            --cache-to type=gha,mode=max,scope=listing-api \
            --build-arg RELEASE_FLAG=$RELEASE_FLAG \
            --build-arg BUILD_OUTPUT=$BUILD_OUTPUT \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/listing-api:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/listing-api:${{ steps.branch_name.outputs.SERVICE_SUFFIX }} \
            -f ../Dockerfile.listing_api \
            --push ..

      - name: Deploy Listing API
        id: deploy_listing
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: listing-api-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/listing-api:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: |
            LOG_FORMAT=json
            RUST_LOG=info
            EA__SERVER__HOST=0.0.0.0
            EA__SERVER__PORT=8080
            EA__DATABASE__CLOUD=true
            EA__DATABASE__INSTANCE_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }}
            EA__DATABASE__USERNAME=${{ env.DB_USER }}
            EA__DATABASE__PASSWORD=${{ env.DB_PASS }}
            EA__DATABASE__DATABASE_NAME=${{ env.DB_NAME}}
            EA__DATABASE__DATABASE_URL=postgres://${{ env.DB_USER }}:${{ env.DB_PASS }}@localhost/${{ env.DB_NAME}}?host=/cloudsql/${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }}&options=-c%20search_path%3D${{ steps.branch_name.outputs.SCHEMA_NAME }}
            GCS_RAW_BUCKET=${{ env.GCS_BUCKET_RAW_PREFIX }}-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
            JWT_SECRET=${{ env.JWT_SECRET }}
          flags: "--no-allow-unauthenticated --service-account ${{ env.SA_LISTING_API }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --ingress=all --min-instances=0 --max-instances=1 --memory=256Mi --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }} --quiet"

      # One hourly Cloud Scheduler job per long-lived environment (dev, main):
      # 2 jobs in total, inside the free tier of 3 jobs per billing account.
      # Feature branches get none; trigger /run-sweeps by hand there if needed.
      - name: Schedule Hourly Booking Sweeps
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        env:
          SUFFIX: ${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          BOOKING_URL: ${{ steps.construct_urls.outputs.booking_url }}
        run: |
          JOB="our-places-sweeps-$SUFFIX"
          SA_EMAIL="${{ env.SA_BOOKING_API }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

          # The job calls booking_api with an OIDC token for this service account.
          gcloud run services add-iam-policy-binding booking-api-$SUFFIX \
            --region=${{ env.REGION }} \
            --member="serviceAccount:$SA_EMAIL" \
            --role="roles/run.invoker" \
            --quiet

          COMMON=(
            --location=${{ env.REGION }}
            --schedule="5 * * * *"
            --time-zone="UTC"
            --uri="$BOOKING_URL/api/v1/internal/cron/run-sweeps"
            --http-method=POST
            --oidc-service-account-email="$SA_EMAIL"
            --oidc-token-audience="$BOOKING_URL"
            --attempt-deadline=320s
            --max-retry-attempts=3
          )
          if gcloud scheduler jobs describe "$JOB" --location=${{ env.REGION }} >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$JOB" "${COMMON[@]}" \
              --update-headers="x-cron-secret=$CRON_SECRET,Content-Type=application/json"
          else
            gcloud scheduler jobs create http "$JOB" "${COMMON[@]}" \
              --headers="x-cron-secret=$CRON_SECRET,Content-Type=application/json"
          fi

      # User API
      - name: Build and Push User API
        run: |
          docker buildx build \
            --cache-from type=gha,scope=user-api \
            --cache-to type=gha,mode=max,scope=user-api \
            --build-arg RELEASE_FLAG=$RELEASE_FLAG \
            --build-arg BUILD_OUTPUT=$BUILD_OUTPUT \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/user-api:${{ github.sha }} \
            -f ../Dockerfile.user_api \
            --push ..

      - name: Deploy User API
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: user-api-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/user-api:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: |
            LOG_FORMAT=json
            RUST_LOG=info
            EA__SERVER__HOST=0.0.0.0
            EA__SERVER__PORT=8080
            EA__DATABASE__CLOUD=true
            EA__DATABASE__INSTANCE_NAME=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }}
            EA__DATABASE__USERNAME=${{ env.DB_USER }}
            EA__DATABASE__PASSWORD=${{ env.DB_PASS }}
            EA__DATABASE__DATABASE_NAME=${{ env.DB_NAME}}
            EA__DATABASE__DATABASE_URL=postgres://${{ env.DB_USER }}:${{ env.DB_PASS }}@localhost/${{ env.DB_NAME}}?host=/cloudsql/${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }}&options=-c%20search_path%3D${{ steps.branch_name.outputs.SCHEMA_NAME }}
            EMAIL_PUBSUB_TOPIC_ID=our-places-email-notifications-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
            JWT_SECRET=${{ env.JWT_SECRET }}
          flags: "--no-allow-unauthenticated --service-account ${{ env.SA_USER_API }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --ingress=all --min-instances=0 --max-instances=1 --memory=256Mi --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:${{ env.DB_INSTANCE_NAME }} --quiet"


  # =========================================================
  # DEPLOY WEB UI GUEST PORTAL (web_ui_guest)
  # =========================================================
  deploy-web-ui-guest:
    name: Build & Deploy Web UI Guest
    runs-on: ubuntu-latest
    needs: [deploy-api, test-web-ui, changes]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || needs.changes.outputs.web_ui_guest == 'true')
    env:
      SA_WEB_APP: ${{ vars[format('INFRA_SA_WEB_APP_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      JWT_SECRET: ${{ secrets[format('JWT_SECRET_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      # Optional custom domain (e.g. https://ourplaces.io); allowed by the bucket CORS rule.
      PUBLIC_URL: ${{ vars[format('GUEST_PORTAL_URL_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: "read"
      id-token: "write"
      issues: "write"
      pull-requests: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Require JWT Secret
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::Secret JWT_SECRET_${{ env.ENV_SUFFIX }} is not set; web_ui_guest refuses to start without it."
            exit 1
          fi

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        env:
          REGION: ${{ env.REGION }}
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sanitize Branch Name
        id: branch_name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          SERVICE_PREFIX: ${{ env.SERVICE_PREFIX_WEB_UI_GUEST }}
        run: |
          SAFE_BRANCH_slug=$(echo "$REF_NAME" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g' | cut -c 1-35 | sed 's/-$//')
          echo "SERVICE_SUFFIX=$SAFE_BRANCH_slug" >> $GITHUB_OUTPUT
          echo "SERVICE_NAME=${SERVICE_PREFIX}-$SAFE_BRANCH_slug" >> $GITHUB_OUTPUT

      - name: Set Release Flag
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "RELEASE_FLAG=--release" >> $GITHUB_ENV
          else
            echo "RELEASE_FLAG=" >> $GITHUB_ENV
          fi

      - name: Build and Push Web UI Guest
        run: |
          docker buildx build \
            --cache-from type=gha,scope=web-ui-guest \
            --cache-to type=gha,mode=max,scope=web-ui-guest \
            --build-arg RELEASE_FLAG=$RELEASE_FLAG \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_PREFIX_WEB_UI_GUEST }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_PREFIX_WEB_UI_GUEST }}:${{ steps.branch_name.outputs.SERVICE_SUFFIX }} \
            -f Dockerfile.web_ui_guest \
            --push .

      - name: Grant Service Permissions
        run: |
          # Grant the portal SA permission to invoke the backend APIs (Cloud Run IAM)
          WEB_APP_SA_EMAIL="${{ env.SA_WEB_APP }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          SUFFIX="${{ needs.deploy-api.outputs.service_suffix }}"
          for API in listing-api booking-api user-api; do
            echo "Granting run.invoker to $WEB_APP_SA_EMAIL on $API-$SUFFIX"
            gcloud run services add-iam-policy-binding $API-$SUFFIX \
              --region=${{ env.REGION }} \
              --member="serviceAccount:$WEB_APP_SA_EMAIL" \
              --role="roles/run.invoker" \
              --quiet
          done

      # The portal calls the APIs' Cloud Run URLs directly on every branch: it
      # sends its service account's ID token for Cloud Run IAM and the user's
      # JWT in X-Forwarded-Authorization. (The API Gateway spec does not cover
      # the routes the portals use.)
      - name: Deploy Web UI Guest
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ steps.branch_name.outputs.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_PREFIX_WEB_UI_GUEST }}:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: |
            LOG_FORMAT=json
            RUST_LOG=info
            HOST=0.0.0.0
            ENABLE_HSTS=true
            JWT_SECRET=${{ env.JWT_SECRET }}
            LISTING_API_URL=${{ needs.deploy-api.outputs.listing_url }}
            BOOKING_API_URL=${{ needs.deploy-api.outputs.booking_url }}
            USER_API_URL=${{ needs.deploy-api.outputs.user_url }}
            LISTING_API_AUDIENCE=${{ needs.deploy-api.outputs.listing_url }}
            BOOKING_API_AUDIENCE=${{ needs.deploy-api.outputs.booking_url }}
            USER_API_AUDIENCE=${{ needs.deploy-api.outputs.user_url }}
          flags: "--allow-unauthenticated --service-account ${{ env.SA_WEB_APP }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --ingress=all --max-instances=1 --memory=512Mi --quiet"

      - name: Show Deployed URL for the Web UI Guest
        run: echo "Deployed Web UI Guest URL ${{ steps.deploy.outputs.url }}"

  # =========================================================
  # DEPLOY WEB UI ADMIN PORTAL (web_ui_admin)
  # =========================================================
  deploy-web-ui-admin:
    name: Build & Deploy Web UI Admin
    runs-on: ubuntu-latest
    needs: [deploy-api, test-web-ui, changes]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || needs.changes.outputs.web_ui_admin == 'true')
    env:
      SA_WEB_APP: ${{ vars[format('INFRA_SA_WEB_APP_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      JWT_SECRET: ${{ secrets[format('JWT_SECRET_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
      # Optional custom domain (e.g. https://ourplaces.io); allowed by the bucket CORS rule.
      PUBLIC_URL: ${{ vars[format('ADMIN_PORTAL_URL_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: "read"
      id-token: "write"
      issues: "write"
      pull-requests: "write"
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Require JWT Secret
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::Secret JWT_SECRET_${{ env.ENV_SUFFIX }} is not set; web_ui_admin refuses to start without it."
            exit 1
          fi

      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker
        env:
          REGION: ${{ env.REGION }}
        run: gcloud auth configure-docker "$REGION-docker.pkg.dev"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Sanitize Branch Name
        id: branch_name
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
          SERVICE_PREFIX: ${{ env.SERVICE_PREFIX_WEB_UI_ADMIN }}
        run: |
          SAFE_BRANCH_slug=$(echo "$REF_NAME" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]//g' | cut -c 1-35 | sed 's/-$//')
          echo "SERVICE_SUFFIX=$SAFE_BRANCH_slug" >> $GITHUB_OUTPUT
          echo "SERVICE_NAME=${SERVICE_PREFIX}-$SAFE_BRANCH_slug" >> $GITHUB_OUTPUT

      - name: Set Release Flag
        env:
          GITHUB_REF: ${{ github.ref }}
        run: |
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "RELEASE_FLAG=--release" >> $GITHUB_ENV
          else
            echo "RELEASE_FLAG=" >> $GITHUB_ENV
          fi

      - name: Build and Push Web UI Admin
        run: |
          docker buildx build \
            --cache-from type=gha,scope=web-ui-admin \
            --cache-to type=gha,mode=max,scope=web-ui-admin \
            --build-arg RELEASE_FLAG=$RELEASE_FLAG \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_PREFIX_WEB_UI_ADMIN }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_PREFIX_WEB_UI_ADMIN }}:${{ steps.branch_name.outputs.SERVICE_SUFFIX }} \
            -f Dockerfile.web_ui_admin \
            --push .

      - name: Grant Service Permissions
        run: |
          # Grant the portal SA permission to invoke the backend APIs (Cloud Run IAM)
          WEB_APP_SA_EMAIL="${{ env.SA_WEB_APP }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"
          SUFFIX="${{ needs.deploy-api.outputs.service_suffix }}"
          for API in listing-api booking-api user-api; do
            echo "Granting run.invoker to $WEB_APP_SA_EMAIL on $API-$SUFFIX"
            gcloud run services add-iam-policy-binding $API-$SUFFIX \
              --region=${{ env.REGION }} \
              --member="serviceAccount:$WEB_APP_SA_EMAIL" \
              --role="roles/run.invoker" \
              --quiet
          done

      # The portal calls the APIs' Cloud Run URLs directly on every branch: it
      # sends its service account's ID token for Cloud Run IAM and the user's
      # JWT in X-Forwarded-Authorization. (The API Gateway spec does not cover
      # the routes the portals use.)
      - name: Deploy Web UI Admin
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ steps.branch_name.outputs.SERVICE_NAME }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPO }}/${{ env.SERVICE_PREFIX_WEB_UI_ADMIN }}:${{ github.sha }}
          region: ${{ env.REGION }}
          env_vars: |
            LOG_FORMAT=json
            RUST_LOG=info
            HOST=0.0.0.0
            ENABLE_HSTS=true
            JWT_SECRET=${{ env.JWT_SECRET }}
            LISTING_API_URL=${{ needs.deploy-api.outputs.listing_url }}
            BOOKING_API_URL=${{ needs.deploy-api.outputs.booking_url }}
            USER_API_URL=${{ needs.deploy-api.outputs.user_url }}
            LISTING_API_AUDIENCE=${{ needs.deploy-api.outputs.listing_url }}
            BOOKING_API_AUDIENCE=${{ needs.deploy-api.outputs.booking_url }}
            USER_API_AUDIENCE=${{ needs.deploy-api.outputs.user_url }}
          flags: "--allow-unauthenticated --service-account ${{ env.SA_WEB_APP }}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com --ingress=all --max-instances=1 --memory=512Mi --quiet"

      # The admin portal uploads listing photos from the browser straight to
      # the raw bucket with signed URLs, so the bucket must allow its origin.
      - name: Allow Portal Origin on Raw Image Bucket (CORS)
        env:
          PORTAL_URL: ${{ steps.deploy.outputs.url }}
          RAW_BUCKET: ${{ env.GCS_RAW_BUCKET_PREFIX }}-${{ steps.branch_name.outputs.SERVICE_SUFFIX }}
        run: |
          ORIGINS=$(jq -cn --arg a "$PORTAL_URL" --arg b "$PUBLIC_URL" '[$a, $b] | map(select(. != "")) | unique')
          jq -n --argjson origins "$ORIGINS" '[{origin: $origins, method: ["PUT"], responseHeader: ["Content-Type"], maxAgeSeconds: 3600}]' > cors.json
          cat cors.json
          gcloud storage buckets update "gs://$RAW_BUCKET" --cors-file=cors.json

      - name: Show Deployed URL for the Web UI Admin
        run: echo "Deployed Web UI Admin URL ${{ steps.deploy.outputs.url }}"

  # =========================================================
  # POINT EMAIL LINKS AT THE PORTALS
  # =========================================================
  # booking_api builds the links in emails from BASE_URL (guest portal) and
  # ADMIN_BASE_URL (admin portal). One job sets both, after both portals.
  configure-email-links:
    name: Configure Email Links
    runs-on: ubuntu-latest
    needs: [deploy-api, deploy-web-ui-guest, deploy-web-ui-admin]
    if: always() && needs.deploy-api.result == 'success'
    env:
      SUFFIX: ${{ needs.deploy-api.outputs.service_suffix }}
      GUEST_URL: ${{ vars[format('GUEST_PORTAL_URL_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] || needs.deploy-web-ui-guest.outputs.url }}
      ADMIN_URL: ${{ vars[format('ADMIN_PORTAL_URL_{0}', github.ref == 'refs/heads/main' && 'PROD' || 'DEV')] || needs.deploy-web-ui-admin.outputs.url }}
    steps:
      - id: "auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Set BASE_URL and ADMIN_BASE_URL on Booking API
        run: |
          # A portal skipped in this run keeps its existing service URL.
          lookup() {
            gcloud run services describe "$1" --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || true
          }
          GUEST_URL=${GUEST_URL:-$(lookup ${{ env.SERVICE_PREFIX_WEB_UI_GUEST }}-$SUFFIX)}
          ADMIN_URL=${ADMIN_URL:-$(lookup ${{ env.SERVICE_PREFIX_WEB_UI_ADMIN }}-$SUFFIX)}

          CURRENT=$(gcloud run services describe booking-api-$SUFFIX --region ${{ env.REGION }} --format=json \
            | jq -r '[.spec.template.spec.containers[0].env[]? | {(.name): .value}] | add // {}')
          UPDATES=()
          for PAIR in "BASE_URL=$GUEST_URL" "ADMIN_BASE_URL=$ADMIN_URL"; do
            NAME=${PAIR%%=*}; VALUE=${PAIR#*=}
            if [ -n "$VALUE" ] && [ "$(echo "$CURRENT" | jq -r --arg n "$NAME" '.[$n] // ""')" != "$VALUE" ]; then
              UPDATES+=("$PAIR")
            fi
          done

          if [ ${#UPDATES[@]} -eq 0 ]; then
            echo "Email links already up to date (BASE_URL=$GUEST_URL, ADMIN_BASE_URL=$ADMIN_URL)."
          else
            echo "Updating booking-api-$SUFFIX: ${UPDATES[*]}"
            gcloud run services update booking-api-$SUFFIX --region ${{ env.REGION }} \
              --update-env-vars "$(IFS=,; echo "${UPDATES[*]}")" --quiet
          fi
