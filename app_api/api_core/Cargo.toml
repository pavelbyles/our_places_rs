[package]
name = "api_core"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web.workspace = true
actix-cors = "0.7.1"
tokio = { workspace = true, features = ["macros", "net", "time", "rt", "fs"] }
serde = { workspace = true }
serde_urlencoded = "0.7.1"
serde_json = { workspace = true }
serde-xml-rs = { workspace = true }
tracing = { workspace = true }
tracing-actix-web = { workspace = true }
tracing-subscriber = { workspace = true, features = [
  "registry",
  "env-filter",
  "json",
] }
config = { workspace = true }
utoipa = { workspace = true }
thiserror = { workspace = true }
validator = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
jsonwebtoken = { workspace = true }
dotenvy = { workspace = true }

db_core.workspace = true
common.workspace = true
sqlx.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
once_cell = "1.20.2"
parking_lot = "0.12.3"
reqwest.workspace = true
base64 = { workspace = true }
url = { workspace = true }
futures-util = "0.3"
async-trait = { workspace = true }

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem", "crypto"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tracing-test = { version = "0.2", features = ["no-env-filter"] }
sqlx-db-tester = { version = "0.7.1", default-features = false, features = ["postgres"] }
