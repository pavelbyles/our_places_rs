[server]
host = "0.0.0.0"
port = "8080"

[log]
level = "info"

[database]
username = "postgres"
password = "password"
port = "5432"
host = "localhost"
database_name = "our_places"
cloud = false
instance_name = ""

env = "Development"

[application]
max_attempts = 5
# How long a pending booking holds its dates. Override per deploy without a
# rebuild: EA__APPLICATION__PENDING_HOLD_MINUTES=60
pending_hold_minutes = 120
# Seconds within which an "effective now" exchange rate is not backdated (1-300).
rate_effective_grace_seconds = 60
# Longest stay a quote or hold accepts, in nights. Only stops absurd date ranges.
max_stay_nights = 3650

[feature_flags]
enable_hard_deletes = false
