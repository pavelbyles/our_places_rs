<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Reset Your Password - Our Places</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background-color: #0f172a; padding: 24px; text-align: center; border-radius: 8px 8px 0 0;">
    <h1 style="color: #ffffff; margin: 0; font-size: 24px; letter-spacing: 0.5px;">Our Places Portal</h1>
  </div>
  <div style="border: 1px solid #e2e8f0; border-top: none; padding: 32px 24px; border-radius: 0 0 8px 8px; background-color: #ffffff;">
    <h2 style="color: #0f172a; margin-top: 0;">Password Reset</h2>
    <p>Hello {{first_name}},</p>
    <p>A password reset was requested for your account. This single-use link expires in <strong>{{expires_minutes}} minutes</strong>.</p>
{{cta}}    <p style="font-size: 13px; color: #64748b;">If you did not request this change, you can safely ignore this email.</p>
  </div>
</body>
</html>
