<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turnover Dispatch Invitation - Our Places</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
  <div style="background-color: #0f172a; padding: 24px; text-align: center; border-radius: 8px 8px 0 0;">
    <h1 style="color: #ffffff; margin: 0; font-size: 24px; letter-spacing: 0.5px;">Our Places Dispatch Portal</h1>
  </div>
  <div style="border: 1px solid #e2e8f0; border-top: none; padding: 32px 24px; border-radius: 0 0 8px 8px; background-color: #ffffff;">
    <h2 style="color: #0f172a; margin-top: 0;">Hello {{first_name}},</h2>
    <p><strong>{{host_name}}</strong> invited you to the Our Places Turnover &amp; Cleaning Crew Dispatch Portal for:</p>
    <div style="background-color: #f8fafc; border-radius: 6px; padding: 16px; margin: 20px 0; border: 1px solid #e2e8f0;">
      <ul style="margin: 0; padding-left: 20px;">
        {{listing_items}}
      </ul>
    </div>
    <p>Set your password using the button below within <strong>{{expires_hours}} hours</strong> to view upcoming turnovers and post status updates.</p>
{{cta}}  </div>
</body>
</html>
